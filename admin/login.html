<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — HER Initiative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=7">
<link rel="stylesheet" href="/admin/admin.css?v=7">
</head>
<body class="admin-body">

<div class="admin-auth-wrap">
  <div class="admin-auth-card">
    <div class="admin-auth-brand">
      <img src="/images/logo-transparent.png" alt="HER Initiative logo">
      <span>HER Initiative</span>
    </div>
    <p class="eyebrow">Members &amp; Admins</p>
    <h1>Sign in</h1>
    <form id="login-form">
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-dark">Sign in</button>
      <p class="form-status" id="login-status" role="status" aria-live="polite"></p>
    </form>
    <a href="/" class="admin-back-link">&larr; Back to website</a>
  </div>
</div>

<script src="/admin/login.js"></script>
</body>
</html>
